<html>
<!--PROFILE-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradiso</title>
  <script src="https://kit.fontawesome.com/aee30e104f.js" crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/aee30e104f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&family=PT+Sans:wght@700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  
</head>

<body onload="trigger();">
  <div class="header">
    <marquee class="nav-brand" behavior="scroll" direction="left">Paradiso</marquee>
    <nav>
        <ul>
          <li><a href="/index"><i class="fa-solid fa-bars"></i>Dashboard</a></li>
          <li><span class="divider"></span></li>
          <li><a href="/2-tracker"><i class="fa-solid fa-face-smile"></i>Mood Tracker</a></li>
          <li><span class="divider"></span></li>
          <li><a href="/3-scheduling"><i class="fa-solid fa-calendar"></i>Scheduling</a></li>
          <li><span class="divider"></span></li>
          <li><a href="/4-page"><i class="fa-solid fa-calendar"></i>Wellness Plan</a></li>
          <li><span class="divider"></span></li>
          <li><a href="/5-page"><i class="fa-solid fa-calendar"></i>Resources</a></li>
          <li><span class="divider"></span></li>
          <li><a href="/6-profile"class = "active"><i class="fa-solid fa-user"></i>Profile</a></li>
          
          <a href="/req/login" class="logout-btn">Logout</a>
        </ul>
    </nav>
  </div>

  <div class="center-box">
    <div class = "profile-container">
      <div class="profile-sidebar">
        <h3>Your Profile</h3>
        <div class="field">Username:</div>
        <div class="field">Password:</div>
        <div class="field">First Name:</div>
        <div class="field">Last Name:</div>
        <div class="field">Email:</div>
        <div class="field">DOB:</div>
        <div class="field">Phone number:</div>
        <div class="field">Emergency Contact:</div>
        <div class="field opt-in">Opt into emergency contacting</div>
      </div>
    
      <div class="profile-content">
        <h3>Update your personal information below</h3>
        <form id="profile-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="johndoe">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
          </div>
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" value="John">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" value="Doe">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="john@example.com">
          </div>
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" value="1990-01-01">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" value="(555) 123-4567">
          </div>
          <div class="form-group">
            <label for="emergencyContact">Emergency Contact</label>
            <input type="text" id="emergencyContact" name="emergencyContact" value="Jane Doe">
          </div>
          <div class="form-group checkbox-group">
            <input type="checkbox" id="optIn" name="optIn">
            <label for="optIn">Opt into emergency contacting</label>
          </div>
          <button type="submit" class="submit-btn">Save Changes</button>
        </form>
      </div>
      
    </div>
</div>
</body>
</html>
<script>
  async function trigger() {
  const res = await fetch('/api/user/profile');
  const user = await res.json();

  document.getElementById('username').value = user.username;
  document.getElementById('firstName').value = user.firstName;
  document.getElementById('lastName').value = user.lastName;
  document.getElementById('email').value = user.email;
  document.getElementById('dob').value = user.dob;
  document.getElementById('phone').value = user.phone;
  document.getElementById('emergencyContact').value = user.emergencyContact;
  document.getElementById('optIn').checked = user.optIn;
  }
</script>
