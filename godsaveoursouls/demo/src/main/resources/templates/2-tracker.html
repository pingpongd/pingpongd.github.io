<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paradiso — Mood Tracker</title>
  <script src="https://kit.fontawesome.com/aee30e104f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/style.css"/>
</head>

<body onload="trigger();">
  <div class="header">
    <marquee class="nav-brand" behavior="scroll" direction="left">Paradiso</marquee>
    <nav>
      <ul>
        <li><a href="/index"><i class="fa-solid fa-bars"></i> Dashboard</a></li>
        <li><span class="divider"></span></li>
        <li><a href="/2-tracker" class="active"><i class="fa-solid fa-face-smile"></i> Mood Tracker</a></li>
        <li><span class="divider"></span></li>
        <li><a href="/3-scheduling"><i class="fa-solid fa-calendar"></i> Scheduling</a></li>
        <li><span class="divider"></span></li>
        <li><a href="/4-page"><i class="fa-solid fa-calendar"></i> Wellness Plan</a></li>
        <li><span class="divider"></span></li>
        <li><a href="/5-page"><i class="fa-solid fa-calendar"></i> Resources</a></li>
        <li><span class="divider"></span></li>
        <li><a href="/6-profile"><i class="fa-solid fa-user"></i> Profile</a></li>
      </ul>
    </nav>
    <a href="/req/login" class="logout-btn">Logout</a>
  </div>

  <div class="center-box-MT">
    <!-- Survey form on the left -->
    <div class="survey-box">
      <h2>Mental Health Survey</h2>
      <form action="/submit-survey" method="POST" id="surveyForm">
        <label>How are you feeling today?</label><br>
        <select name="mood" required>
          <option value="">--Select--</option>
          <option value="happy">Happy</option>
          <option value="sad">Sad</option>
          <option value="anxious">Anxious</option>
          <option value="tired">Tired</option>
        </select><br><br>

        <label>How many hours of sleep did you get last night?</label><br>
        <input type="number" name="sleepHours" min="0" max="24" required><br><br>

        <label>Over the last 7 days, how often have you been feeling anxious or on edge?</label><br>
        <select name="anxiety" required>
          <option value="">--Select--</option>
          <option>Strongly Agree</option>
          <option>Agree</option>
          <option>Neutral</option>
          <option>Disagree</option>
          <option>Strongly Disagree</option>
        </select><br><br>

        <label>Over the last 7 days, how often have you been feeling down, depressed, or hopeless?</label><br>
        <select name="depression" required>
          <option value="">--Select--</option>
          <option>Strongly Agree</option>
          <option>Agree</option>
          <option>Neutral</option>
          <option>Disagree</option>
          <option>Strongly Disagree</option>
        </select><br><br>

        <label>Over the last 7 days, how often have you been having little interest or pleasure in doing things?</label><br>
        <select name="interest" required>
          <option value="">--Select--</option>
          <option>Strongly Agree</option>
          <option>Agree</option>
          <option>Neutral</option>
          <option>Disagree</option>
          <option>Strongly Disagree</option>
        </select><br><br>

        <label>Would you like to be contacted by a counselor?</label><br>
        <input type="radio" name="contact" value="yes"> Yes  
        <input type="radio" name="contact" value="no"> No<br><br>

        <button type="submit">Submit Survey</button>
      </form>
    </div>

    <!-- Calendar with month toggles -->
    <div class="calendar-container">
      <div class="calendar-nav">
        <button id="prevMonth" aria-label="Previous month">&lt;</button>
        <h3 id="monthYear">April 2025</h3>
        <button id="nextMonth" aria-label="Next month">&gt;</button>
      </div>
      <div id="calendar">
        <!-- day‐of‐week headers -->
        <div class="dow">Sun</div>
        <div class="dow">Mon</div>
        <div class="dow">Tue</div>
        <div class="dow">Wed</div>
        <div class="dow">Thu</div>
        <div class="dow">Fri</div>
        <div class="dow">Sat</div>

        <!-- placeholders for April 1 starting on Tuesday -->
        <div class="day"></div>
        <div class="day"></div>

        <!-- static days 1–30 -->
        <div class="day">1</div>
        <div class="day">2</div>
        <div class="day">3</div>
        <div class="day">4</div>
        <div class="day">5</div>
        <div class="day">6</div>
        <div class="day">7</div>
        <div class="day">8</div>
        <div class="day">9</div>
        <div class="day">10</div>
        <div class="day">11</div>
        <div class="day">12</div>
        <div class="day">13</div>
        <div class="day">14</div>
        <div class="day">15</div>
        <div class="day">16</div>
        <div class="day">17</div>
        <div class="day">18</div>
        <div class="day">19</div>
        <div class="day">20</div>
        <div class="day">21</div>
        <div class="day">22</div>
        <div class="day">23</div>
        <div class="day">24</div>
        <div class="day">25</div>
        <div class="day">26</div>
        <div class="day">27</div>
        <div class="day">28</div>
        <div class="day">29</div>
        <div class="day">30</div>
      </div>
    </div>
  </div>
</body>
</html>
