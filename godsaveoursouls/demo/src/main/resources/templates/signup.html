<html>

<head>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&family=PT+Sans:wght@700&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>

<body onload="trigger();">
  <div class="header">
  <marquee class="nav-brand" behavior="scroll" direction="left">Paradiso</marquee>
  <nav>
    <ul>
      <li><a href="/req/login">Login</a></li>
      <li><a href="/req/signup"class = "active">Sign Up</a></li>
    </ul>
  </nav>
</div>



<div class="center-box">
  <div class="form-container">
    <h2>Sign Up</h2>
  <form action="/req/signup" method="post">
    <input type="text" name="username" id="username" placeholder="Username" required><br> 
    <input type="email" name="email" id="email" placeholder="Email" title="Please enter a valid email address" required><br> 
    <input type="password" name="password" id="password" placeholder="Password" required><br> 
    <input type="password" name="passwordcon" id="passwordcon" placeholder="Confirm Password" required><br> 
    <button type="submit" id="submit" onclick="redirectToLogin()">Create Account</button>

<script>
function redirectToLogin() {
  window.location.href = "/req/login";
}
</script>
  </form>
</div>
</div>
</body>

</html>

<script>
const submitButton = document.getElementById("submit");
submitButton.addEventListener('click', ()=>{
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('passwordcon').value;
  const email = document.getElementById('email').value;
  const data = {
    username,
    password,
    email
  }

  if(password==confirmPassword){
    const jsonData = JSON.stringify(data);
    fetch('/req/signup', {  
      method: 'POST',
      headers:{
        'Content-Type': 'application/json'
      },
      body: jsonData
    })
    .then(response => {
      //handling response
    })
  }


})

</script>
