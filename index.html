<html>

<head>
  
</head>

<body>
  <form onsubmit="goToPage(); return false;">

  <label for="firstname">First name:</label><br>
  <input type="text" id="firstname" name="firstname"><br>
  <label for="lastname">Last name:</label><br>
  <input type="text" id="lastname" name="lastname"><br><br>

  <input type="submit" value="Submit">
</form>
<script>

function goToPage() {

var firstname = document.getElementById("firstname").value.trim().toLowerCase();
var lastname = document.getElementById("lastname").value.trim().toLowerCase();

if (firstname === "sadie" && lastname === "wyman") {
  window.location.href = "sadiewyman.html";
}
else {
  window.location.href = "test.html";
}

}



</script>

</body>

</html>
